name: Actualizar datos y publicar

on:
  schedule:
    - cron: "*/15 * * * *"   # cada 15 min (GitHub puede retrasarlo unos minutos)
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_static:
        description: "Forzar la descarga de naves (normalmente solo con parche nuevo)"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Recoger datos (si falla, no se publica y se queda la version anterior)
        run: |
          export PREV_BASE="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/data"
          python collector/collect.py
        env:
          UEX_TOKEN: ${{ secrets.UEX_TOKEN }}
          FORCE_STATIC: ${{ inputs.force_static }}
      - name: Copiar la web si existe
        run: if [ -d web ]; then cp -r web/. site/; fi
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
